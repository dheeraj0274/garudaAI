<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Garuda AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 20px;
    }

    .title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .name {
      color: #60a5fa;
      font-weight: bold;
    }

    .message {
      font-size: 16px;
      line-height: 1.6;
      margin-top: 15px;
      color: #d1d5db;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 20px;
      background: #22c55e;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo">⚡ Garuda AI</div>

    <div class="title">
      Welcome <span class="name">{{name}}</span> 🎉
    </div>

    <div class="message">
      Your account has been successfully created.  
      We’re excited to have you on Garuda AI platform.  
      Start exploring AI-powered features and boost your productivity 🚀
    </div>

    <a href="https://garuda.help" class="btn">
      Go to Dashboard
    </a>

    <div class="footer">
      © 2026 Garuda AI. All rights reserved.
    </div>

  </div>

</body>
</html>
