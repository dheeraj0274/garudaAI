<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OTP Verification - Garuda AI</title>
</head>

<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:20px 0; background:#f4f6f8;">
    <tr>
      <td align="center">

        <!-- Container -->
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:10px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:#111827; padding:20px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:22px;">
                Garuda AI
              </h1>
             
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px;">

              <h2 style="margin:0 0 10px; color:#111827;">
                Email Verification
              </h2>

              <p style="color:#374151; font-size:14px; line-height:1.6;">
                Hello,<br><br>
                Use the OTP below to verify your account on <strong>Garuda AI</strong>.
                This code is valid for <strong>5 minutes</strong>.
              </p>

              <!-- OTP Box -->
              <div style="text-align:center; margin:30px 0;">
                <span style="display:inline-block; background:#4f46e5; color:#ffffff; font-size:28px; letter-spacing:6px; padding:14px 28px; border-radius:8px;">
                  {{OTP}}
                </span>
              </div>

              <p style="color:#6b7280; font-size:13px;">
                If you did not request this, you can safely ignore this email.
              </p>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f9fafb; padding:20px; text-align:center;">

              <p style="margin:0; font-size:12px; color:#6b7280;">
                © 2026 Garuda AI. All rights reserved.
              </p>

              <p style="margin:5px 0 0; font-size:11px; color:#9ca3af;">
                This is an automated email. Please do not reply.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
